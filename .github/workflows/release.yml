name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish tagged release
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@carvalhorafael"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EXECUTIVE_SIGNAL_PACKAGES_TOKEN }}
        run: npm ci

      - name: Resolve release tag
        id: release
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Ensure release tag is new
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG_NAME}"; then
            echo "Release tag ${TAG_NAME} already exists. Bump the theme version before merging to main."
            exit 1
          fi

      - name: Check release version
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: npm run release:check-version -- "${TAG_NAME}"

      - name: Build and validate release package
        run: npm run release:package

      - name: Create release tag
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${TAG_NAME}" \
            dist/executive-signal-wordpress-theme.zip \
            --title "${TAG_NAME}" \
            --generate-notes
