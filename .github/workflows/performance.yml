name: Performance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit (advisory)
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@carvalhorafael"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EXECUTIVE_SIGNAL_PACKAGES_TOKEN }}
        run: npm ci

      - name: Verify Chrome
        run: google-chrome --version

      - name: Checkout companion plugins
        run: |
          mkdir -p ../plugins-wordpress
          git clone --depth=1 --branch develop https://github.com/carvalhorafael/free-materials.git ../plugins-wordpress/free-materials
          git clone --depth=1 https://github.com/carvalhorafael/online-courses.git ../plugins-wordpress/online-courses
          git clone --depth=1 --branch develop https://github.com/carvalhorafael/crm-leads-capture.git ../plugins-wordpress/crm-leads-capture

      - name: Start WordPress
        run: npm run wp:start

      - name: Install PHP dependencies
        run: npm run composer:install

      - name: Build theme and create performance fixtures
        run: |
          npm run build
          npm run perf:fixtures

      - name: Run Lighthouse audit
        run: npm run perf:lighthouse

      - name: Record asset sizes
        run: npm run perf:assets

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: performance-audit-${{ github.run_id }}
          path: |
            reports/lighthouse-ci/
            reports/assets/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npm run wp:stop
