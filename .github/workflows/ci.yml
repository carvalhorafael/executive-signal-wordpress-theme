name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate theme
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@carvalhorafael"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EXECUTIVE_SIGNAL_PACKAGES_TOKEN }}
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start WordPress
        run: npm run wp:start

      - name: Install PHP dependencies
        run: npm run composer:install

      - name: Run automated tests
        run: npm test

      - name: Validate release package
        if: github.base_ref == 'main' || (github.event_name == 'push' && github.ref_name == 'main')
        run: npm run validate

      - name: Upload theme ZIP
        if: github.base_ref == 'main' || (github.event_name == 'push' && github.ref_name == 'main')
        uses: actions/upload-artifact@v5
        with:
          name: executive-signal-wordpress-theme
          path: dist/executive-signal-wordpress-theme.zip
          if-no-files-found: error

      - name: Stop WordPress
        if: always()
        continue-on-error: true
        run: npm run wp:stop
